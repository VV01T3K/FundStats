# Production stack: the web app (pages + read-only API), the collector and Postgres.
# Configure with a .env file next to this one; see .env.example. Start: docker compose up -d --build
name: fundstats

# Database settings both apps read. An empty value means the app's default (see README).
x-database-env: &database-env
  DATABASE_URL: postgres://fundstats:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/fundstats
  DB_POOL_MAX: ${DB_POOL_MAX:-}
  DB_STATEMENT_TIMEOUT: ${DB_STATEMENT_TIMEOUT:-}

services:
  # Applies pending migrations once, then exits; the apps start only after it succeeded.
  migrate:
    build:
      context: .
      target: collector
    image: fundstats-collector:latest
    command: ["collector.js", "migrate"]
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      <<: *database-env

  web:
    build:
      context: .
      target: web
    image: fundstats-web:latest
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      <<: *database-env
    # Published on loopback only, for a reverse proxy on the same host. Set
    # FUNDSTATS_BIND=0.0.0.0 to expose it on every interface.
    ports:
      - "${FUNDSTATS_BIND:-127.0.0.1}:${FUNDSTATS_PORT:-3000}:3000"

  collector:
    build:
      context: .
      target: collector
    image: fundstats-collector:latest
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      <<: *database-env
      COLLECTOR_ENABLED: ${COLLECTOR_ENABLED:-}
      COLLECTOR_INTERVAL_MBANK: ${COLLECTOR_INTERVAL_MBANK:-}
      COLLECTOR_INTERVAL_COINGECKO: ${COLLECTOR_INTERVAL_COINGECKO:-}
      COLLECTOR_INTERVAL_COINPAPRIKA: ${COLLECTOR_INTERVAL_COINPAPRIKA:-}
      COLLECTOR_INTERVAL_COINMARKETCAP: ${COLLECTOR_INTERVAL_COINMARKETCAP:-}
      RAW_PAYLOAD_RETENTION_DAYS: ${RAW_PAYLOAD_RETENTION_DAYS:-}
      FETCH_TIMEOUT: ${FETCH_TIMEOUT:-}
      COINGECKO_API_KEY: ${COINGECKO_API_KEY:-}
      CMC_API_KEY: ${CMC_API_KEY:-}

  db:
    image: postgres:18.4-alpine@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15
    restart: unless-stopped
    environment:
      POSTGRES_USER: fundstats
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: fundstats
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fundstats -d fundstats"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db-data:
