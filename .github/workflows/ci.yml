name: CI

on:
  # Every PR, including ones stacked on a feature branch.
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # ubuntu-latest has Docker, which the tests need for their Postgres container (testcontainers).
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      # Same Node major as the Dockerfile; vitest and vite run on Node.
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      # Format check, then oxlint with type-aware rules and the local plugin.
      - run: bun run check
      - run: bun run typecheck
      - run: bun run knip
      - run: bun run test
      - run: bun run build
